function startErudite(l){
 mode='erudite';level=l;
 let selected=erudite.map((q,i)=>({q:q[0],opts:q[1],a:q[2],why:q[3],level:q[4],type:q[5],id:i}));
 if(l!=='Смешанный')selected=selected.filter(q=>q.level===l);
 if(l==='Смешанный')selected=selected.sort(()=>Math.random()-.5);
 pool=selected.map(q=>({...q,typed:typedAnswers[q.id]}));
 beginQuiz();
}
function beginQuiz(){
 index=0;correctRound=0;answered=false;hinted=false;
 lastQuestions=pool.slice();show('quiz');renderQuestion();
}
function renderQuestion(){
 const q=pool[index];answered=false;hinted=false;
 $('quizLabel').textContent=`${level} · Вопрос ${index+1} из ${pool.length}`;
 $('quizProgress').style.width=(index/pool.length*100)+'%';
 $('questionText').textContent=q.q;
 $('feedback').className='feedback hidden';
 $('nextButton').classList.add('hidden');
 $('hintButton').classList.remove('hidden');
 $('hintButton').disabled=data.stars<3;
 if(q.type==='input'){
  $('answerArea').innerHTML='<input id="typedAnswer" type="text" placeholder="Напиши свой ответ"><button class="btn" id="submitTyped">Проверить ответ</button>';
  $('submitTyped').onclick=()=>checkTyped();
 }else{
  $('answerArea').innerHTML='<div class="answers">'+q.opts.map((a,i)=>`<button class="answer" data-answer="${i}">${a}</button>`).join('')+'</div>';
  $('answerArea').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>checkAnswer(q.opts[+b.dataset.answer]));
 }
}
function normalize(s){return String(s).toLowerCase().trim().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ')}
function checkTyped(){
 const q=pool[index],v=$('typedAnswer').value;
 if(!v.trim())return;
 const ok=normalize(v)===normalize(q.typed||q.a);
 finishAnswer(ok);
}
function checkAnswer(v){finishAnswer(normalize(v)===normalize(pool[index].a))}
function finishAnswer(ok){
 if(answered)return;answered=true;
 const q=pool[index];
 data.solved++;if(ok){data.correct++;data.streak++;data.best=Math.max(data.best,data.streak);correctRound++;
  const reward=mode==='child'?2:level==='Разминка'?2:level==='Профи'?3:5;
  data.stars+=reward;
 }else data.streak=0;

}

 $('feedback').className='feedback';
 $('feedback').textContent='💡 Подумай ещё раз: '+q.why;
 $('hintButton').disabled=true;
}

function award(id){
 if(data.medals.includes(id))return;
 data.medals.push(id);save();
 const m=catalog.find(x=>x[0]===id);
 if(m){$('medalTitle').textContent=m[1]+' '+m[2];$('medalDescription').textContent='Новая медаль! '+m[3];$('medalModal').classList.add('open')}
}
function checkAchievements(){
 const e=data.erudite.solved,c=data.child.solved,s=data.streak;
 [25,100,250,500,1000].forEach(n=>{if(e>=n)award('erudite_'+n);if(c>=n)award('child_'+n)});
 [10,25,50,100].forEach(n=>{if(s>=n)award('streak_'+n)});

}
